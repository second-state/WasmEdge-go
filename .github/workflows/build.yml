name: build

concurrency:
  group: build-${{ github.head_ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master

jobs:
  build_ubuntu:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 1
      USE_BAZEL_VERSION: 7.4.1
    strategy:
      matrix:
        go: [ '1.25.x', '1.26.x' ]
    name: Build WasmEdge-go on Ubuntu 24.04 x86_64 with Go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v6
      - name: Install go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Check go version
        run: go version
      - name: Install wasmedge
        run: |
          wget -qO- https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install_v2.sh | bash -s -- -v 0.17.1
      - name: Build WasmEdge-go
        run: |
          source $HOME/.wasmedge/env
          go build ./wasmedge/
      - name: Unit tests
        run: |
          source $HOME/.wasmedge/env
          go test ./wasmedge/ -count=1
      - name: Bazel Test
        run: |
          bazel test //... \
            --test_output=errors \
            --copt="-I$HOME/.wasmedge/include" \
            --linkopt="-L$HOME/.wasmedge/lib" \
            --action_env=LD_LIBRARY_PATH=$HOME/.wasmedge/lib \
            --action_env=DYLD_LIBRARY_PATH=$HOME/.wasmedge/lib \
            --@io_bazel_rules_go//go/config:pure=false

  build_macos:
    runs-on: macos-14
    env:
      CGO_ENABLED: 1
      USE_BAZEL_VERSION: 7.4.1
    strategy:
      matrix:
        go: [ '1.25.x', '1.26.x' ]
    name: Build WasmEdge-go on macOS 14 arm64 with Go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v6
      - name: Install go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Check go version
        run: go version
      - name: Install wasmedge
        run: |
          wget -qO- https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install_v2.sh | bash -s -- -v 0.17.1
      - name: Build WasmEdge-go
        run: |
          source $HOME/.wasmedge/env
          go build ./wasmedge/
      - name: Unit tests
        run: |
          source $HOME/.wasmedge/env
          go test ./wasmedge/ -count=1
      - name: Bazel Test
        run: |
          bazel test //... \
            --test_output=errors \
            --copt="-I$HOME/.wasmedge/include" \
            --linkopt="-L$HOME/.wasmedge/lib" \
            --action_env=LD_LIBRARY_PATH=$HOME/.wasmedge/lib \
            --action_env=DYLD_LIBRARY_PATH=$HOME/.wasmedge/lib \
            --@io_bazel_rules_go//go/config:pure=false
