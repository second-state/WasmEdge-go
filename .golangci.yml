version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive
    - staticcheck
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          # Every public symbol carries a doc comment (Global Constraint).
          severity: error
  exclusions:
    rules:
      # Test helpers intentionally ignore Close errors in cleanup paths.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
